name: Pobierz postać

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_character.py
      - name: Zapisz
        run: |
          git config user.name "poe-crafting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/character
          git diff --cached --quiet && exit 0
          git commit -m "Aktualizacja postaci"
          git pull --rebase
          git push
