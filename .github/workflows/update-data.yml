name: Aktualizacja cen z poe.ninja

on:
  schedule:
    - cron: "17 * * * *"   # co godzinę
  workflow_dispatch:        # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz ceny
        run: python scripts/fetch_prices.py
      - name: Zapisz zmiany
        run: |
          git config user.name "poe-crafting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Brak zmian" && exit 0
          git commit -m "Aktualizacja cen"
          git push
