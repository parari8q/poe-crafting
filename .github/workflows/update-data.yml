name: Aktualizacja cen z poe.ninja

on:
  schedule:
    - cron: "17 * * * *"   # co godzinę
  workflow_dispatch:        # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz ceny
        run: python scripts/fetch_prices.py
      - name: Opisy przedmiotów (raz na dobę)
        run: |
          # checkout ustawia daty plików na teraz, więc wiek liczymy z historii gita
          last=$(git log -1 --format=%ct -- data/items.json 2>/dev/null || echo 0)
          if [ $(( $(date +%s) - ${last:-0} )) -gt 86000 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE=1 python scripts/fetch_items.py
          else
            echo "Opisy świeże"
          fi
      - name: Zapisz zmiany
        run: |
          git config user.name "poe-crafting-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Brak zmian" && exit 0
          git commit -m "Aktualizacja cen"
          git push
